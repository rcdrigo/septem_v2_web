name: Deploy to GitHub Pages (DESATIVADO — Fase 11)

# Fase 11: o front migrou para a Cloudflare Pages (front + BFF) — ver
# `deploy-cloudflare.yml`. O GitHub Pages é estático e NÃO tem o BFF; publicar o
# build modo-cookie aqui resultaria num app quebrado (sem proxy /api, sem
# bootstrap SSR, sem cookie de sessão). Por isso este workflow NÃO roda mais em
# push — fica só manual (workflow_dispatch), como referência histórica.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages serve sob /septem_v2_web/ (subpath).
          VITE_BASE: /septem_v2_web/
          # URL pública do backend (Render). Default aponta pro ambiente provisório;
          # pode sobrescrever em Settings → Secrets and variables → Actions → Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://septem-api.onrender.com' }}
          # Pages é host único (sem subdomínio por tenant) → tenant fixo no build.
          VITE_TENANT: ${{ vars.VITE_TENANT || 'prefeitura-x' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
