name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages serve sob /septem_v2_web/ (subpath).
          VITE_BASE: /septem_v2_web/
          # URL pública do backend (Render). Default aponta pro ambiente provisório;
          # pode sobrescrever em Settings → Secrets and variables → Actions → Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://septem-api.onrender.com' }}
          # Pages é host único (sem subdomínio por tenant) → tenant fixo no build.
          VITE_TENANT: ${{ vars.VITE_TENANT || 'prefeitura-x' }}
      # SPA no Pages: qualquer caminho fundo (`/platform/login`, `/admin/transfers`,
      # `/requests/<id>`) devolvia 404 do próprio GitHub, porque só existe `index.html`
      # na raiz. O Pages serve `404.html` para o que não casa com arquivo — copiar o
      # index para lá faz o roteador do SPA assumir. Sem isto, a área central só era
      # alcançável navegando por dentro do app, e link colado no navegador não abria.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
